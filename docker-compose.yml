version: '3.8'

services:
  nexus-db:
    image: mysql:8.0
    container_name: nexus-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nexusreview
      TZ: Asia/Shanghai
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  nexus-redis:
    image: redis:6.2
    container_name: nexus-redis
    command: redis-server --requirepass 123321
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  nexus-redis-init:
    image: redis:6.2
    container_name: nexus-redis-init
    depends_on:
      - nexus-redis
    command: >
      sh -c "
        echo 'Wait for Redis to start...'
        sleep 5
        echo 'Initializing stream in Redis...'
        redis-cli -h nexus-redis -p 6379 -a 123321 XGROUP CREATE stream.orders g1 0 MKSTREAM || echo 'Stream already exists or failed to create.'
      "

  nexus-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    environment:
      - API-KEY=${API_KEY}
      - TZ=Asia/Shanghai
    ports:
      - "8081:8081"
    depends_on:
      - nexus-db
      - nexus-redis
    volumes:
      - ./nexus-frontend/html/nexusreview/imgs/:/usr/share/nginx/html/nexusreview/imgs/

  nexus-nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nexus-frontend/html:/usr/share/nginx/html
      - ./nexus-frontend/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - nexus-backend

volumes:
  redis-data:
