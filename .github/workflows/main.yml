name: NexusReview CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -f nexus-backend/pom.xml clean package -DskipTests

  docker-build-push:
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Build and push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USER }}/nexus-backend:latest
          ${{ secrets.DOCKER_HUB_USER }}/nexus-backend:${{ github.sha }}

    - name: Build and push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./nexus-frontend
        file: ./nexus-frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USER }}/nexus-frontend:latest
          ${{ secrets.DOCKER_HUB_USER }}/nexus-frontend:${{ github.sha }}

  deploy-to-k8s:
    needs: docker-build-push
    runs-on: ubuntu-latest
    # 此步骤仅作为模板展示，实际运行需要配置 KUBECONFIG
    steps:
    - uses: actions/checkout@v4
    - name: Set up Kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    - name: Deploy to K8s
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/nexus-backend backend=${{ secrets.DOCKER_HUB_USER }}/nexus-backend:${{ github.sha }} -n nexusreview
        kubectl set image deployment/nexus-frontend nginx=${{ secrets.DOCKER_HUB_USER }}/nexus-frontend:${{ github.sha }} -n nexusreview
