spring:
  application:
    name: nexus-review
    #配置数据库连接信息
  datasource:
    url: jdbc:mysql://nexus-db:3306/nexusreview?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  data:
    redis:
      host: nexus-redis
      port: 6379
      password: 123321
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      database: 0
  kafka:
    bootstrap-servers: nexus-kafka:9092
    producer:
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: seckill-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 60MB
mybatis-plus:
  type-aliases-package: com.nexusreview.entity # 别名扫描包
logging:
  level:
    com.nexusreview: debug
server:
  port: 8081
# 配置ai模型
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${API-KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com/v1
      api-key: ${API-KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true
    embedding-model:
      # 注意：DeepSeek不原生提供Embedding服务，如果原项目启用了向量检索功能(RAG)，
      # 此处如果报错可考虑换回支持Embedding的API(如通义千问或原生OpenAI)
      base-url: https://api.deepseek.com/v1
      api-key: ${API-KEY}
      model-name: deepseek-chat
      log-requests: true
      log-responses: true