apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusreview-ingress
  namespace: nexusreview
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: nexusreview.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nexus-frontend
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nexus-backend
            port:
              number: 8081
